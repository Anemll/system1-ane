name: tests
# Linux CI: imports, --help and unit tests only. ANE convert/compile/serve need a Mac with Core AI and are not run here.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-inference.txt
      - name: CLI help
        run: |
          python forge.py system1-ane-serve --help
          python forge.py jeff-convert --help
          python forge.py jeff-train-lora --help
          python scripts/download_model.py --list
      - name: Unit tests
        run: python -m unittest discover -s tests -v
